name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 37
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDKROOT" > local.properties
          SDKM="$(ls -d "$SDKROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SDKM" ]; then SDKM="$(command -v sdkmanager || true)"; fi
          echo "sdkroot=$SDKROOT"
          echo "sdkmanager=$SDKM"
          test -n "$SDKM"
          yes | "$SDKM" --licenses
          "$SDKM" "platforms;android-37" "build-tools;37.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moneysav-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
